name: Feature
description: New capability, delivered through one or more PBIs
type: Feature
projects: ["The-Gifts-Club/5"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
  - type: dropdown
    id: app
    attributes:
      label: App
      multiple: true
      options: [play, play-api, saas, saas-website, landing, services, loyalty, modules, infra]
  - type: textarea
    id: notes
    attributes:
      label: Notes and links
